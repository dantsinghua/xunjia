# Include inside the existing South Bank port 80 server {} block.
# Keep existing locations unchanged; xunjia-map.conf is loaded by http conf.d/*.conf.
location = /xunjia {
    return 308 /xunjia/$is_args$args;
}

location ^~ /xunjia/ {
    proxy_pass http://127.0.0.1:18770/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /xunjia;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xunjia_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}
