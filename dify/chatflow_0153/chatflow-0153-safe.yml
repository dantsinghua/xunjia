      position:
        x: 1550
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        title: parse_first
        desc: ''
        type: code
        code_language: python3
        code: "import json\n\ndef loads(text):\n    def pairs(items):\n        value = {}\n        for key, item\
          \ in items:\n            if key in value:\n                raise ValueError('duplicate key')\n       \
          \     value[key] = item\n        return value\n    def invalid(value):\n        raise ValueError('nonfinite\
          \ JSON')\n    if not isinstance(text, str) or len(text) > 100000:\n        raise ValueError('invalid or\
          \ oversized JSON')\n    value = json.loads(text, object_pairs_hook=pairs, parse_constant=invalid)\n  \
          \  if not isinstance(value, dict):\n        raise ValueError('object required')\n    return value\n\n\n\
          def dumps(value):\n    return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',',\
          \ ':'))\n\n\ndef check_turn(value, trusted):\n    keys = {'schema_version', 'turn_id', 'conversation_epoch',\
          \ 'source_message_id', 'observations',\n            'proposed_actions', 'public_message', 'trader_view',\
          \ 'memory_patch', 'history_request', 'validation_ref'}\n    if set(value) != keys or value['schema_version']\
          \ != '1':\n        raise ValueError('invalid AgentTurn fields')\n    if any(value[k] != trusted[k] for\
          \ k in ('turn_id', 'conversation_epoch', 'source_message_id')):\n        raise ValueError('untrusted turn\
          \ identity')\n    if type(value['conversation_epoch']) is not int:\n        raise ValueError('invalid\
          \ epoch')\n    for key in ('observations', 'proposed_actions'):\n        if not isinstance(value[key],\
          \ list) or len(value[key]) > 50 or not all(isinstance(v, dict) for v in value[key]):\n            raise\
          \ ValueError('invalid array')\n    if any(a.get('type') not in ('SOCIAL_REPLY', 'CLARIFY_BOND', 'ASK_QUOTE',\
          \ 'COUNTER', 'WAIT', 'REQUEST_HANDOFF') for a in value['proposed_actions']):\n        raise ValueError('invalid\
          \ action')\n    if not isinstance(value['trader_view'], dict) or any(value[k] is not None and not isinstance(value[k],\
          \ dict) for k in ('memory_patch', 'history_request')):\n        raise ValueError('invalid proposal object')\n\
          \    return value\n\n\ndef parse_strict(text, trusted_json, second_pass):\n    trusted = loads(trusted_json)\n\
          \    proposal = check_turn(loads(text), trusted)\n    if proposal['history_request'] is not None:\n  \
          \      if second_pass:\n            raise ValueError('history budget exhausted')\n        request = proposal['history_request']\n\
          \        if set(request) - {'message_refs', 'keywords', 'date_range', 'reason'}:\n            raise ValueError('invalid\
          \ history request')\n        for key in ('message_refs', 'keywords'):\n            if key in request and\
          \ (not isinstance(request[key], list) or len(request[key]) > 50 or not all(isinstance(v, str) and 0 <\
          \ len(v) <= 200 for v in request[key])):\n                raise ValueError('history bounds exceeded')\n\
          \        proposal['proposed_actions'] = [{'type': 'WAIT'}]\n    # Private model output never supplies\
          \ final public prose or a validation ticket.\n    proposal['public_message'] = None\n    proposal['validation_ref']\
          \ = None\n    return {'proposal': dumps(proposal)}\n\n\ndef parse_first(text, trusted_json):\n    try:\n\
          \        parsed = parse_strict(text, trusted_json, False)\n        return {'valid': 'true', 'proposal':\
          \ parsed['proposal']}\n    except (ValueError, TypeError, KeyError):\n        return {'valid': 'false',\
          \ 'proposal': ''}\n\n\ndef main(text, trusted_json):\n    return parse_first(text, trusted_json)\n"
        variables:
        - variable: text
          value_selector:
          - private_agent
          - text
        - variable: trusted_json
          value_selector:
          - prepare_context
          - trusted
        outputs:
          valid:
            type: string
            children: null
          proposal:
            type: string
            children: null
        selected: false
    - id: format_ok
      type: custom
      position:
        x: 1860
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        title: format_ok
        desc: ''
        type: if-else
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - variable_selector:
            - parse_first
            - valid
            comparison_operator: is
            value: 'true'
        selected: false
        conditions: []
        logical_operator: and
    - id: repair_json
      type: custom
      position:
        x: 2170
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        title: repair_json
        desc: ''
        type: llm
        model: &id001
          provider: openai_api_compatible
          name: kimi-k2.5
          mode: chat
          completion_params:
            temperature: 0
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        prompt_template:
        - role: system
          text: '仅修复一次AgentTurn JSON的语法和字段形状，不新增事实、价格、授权或证据。输入是私有模型提案和可信身份；返回单一JSON对象，不用Markdown，不调用工具。schema_version=1字符串，身份必须与可信上下文一致。顶层字段仅schema_version,turn_id,conversation_epoch,source_message_id,observations,proposed_actions,public_message,trader_view,memory_patch,history_request,validation_ref。public_message和validation_ref必须null。无法无歧义恢复内容则用WAIT、空观察、空trader_view与null记忆/补历史，禁止猜交易事实。

            '
        - role: user
          text: '可信身份:

            {{#prepare_context.trusted#}}

            待修复文本:

            {{#private_agent.text#}}'
        selected: false
        variables: []
