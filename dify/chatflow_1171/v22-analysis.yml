          s*'+price+\n                        r'\\s*(?:出|收|买|卖|ofr|bid)\\s*'+size+r'\\\
          s*',quoted,re.I):return False\n    calculation=text[marker.end():]\n   \
          \ if not (re.search(r'假设',calculation) and re.search(r'收益率',calculation)\n\
