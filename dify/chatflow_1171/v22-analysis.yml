          \ False\n    if re.search(r'按|照|原价|那个价|不变|改|撤|如果|假如|条件|别家|客户|\\b(?:bid|ofr|offer)\\\
          b',calculation,re.I):return False\n    candidates=classify_spans(calculation,extract_spans(calculation))\n\
          \    numeric=[span for span in candidates if span['lexical'] in ('NUMBER','BP','DATE','SETTLEMENT','TENOR')]\n\
          \    if len(numeric)!=2 or any(span['roles']!=['YIELD'] for span in numeric):return\
          \ False\n    first,second=numeric\n    # Two numbers alone do not establish\
