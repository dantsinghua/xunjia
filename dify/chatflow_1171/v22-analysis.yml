          \               gap=gaps.setdefault(mid,{'source_ids':[],'missing_ids':[]})\n                gap['source_ids']=sorted(set(gap['source_ids'])|{message['message_id']})\n\
          \                gap['missing_ids']=sorted(set(gap['missing_ids'])|missing)\n    return gaps\n\n\"\"\"Source-bound\
