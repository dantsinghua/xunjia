version: 0.7.0
kind: app
app:
  name: Xunjia V2.2 A analysis
  mode: advanced-chat
  description: Versioned facts and independent negotiation; application validates and controls all sending.
  icon: 🤖
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 240
      sourcePosition: right
      targetPosition: left
      data:
        title: start
        desc: ''
        selected: false
        type: start
        variables:
        - variable: context_json
          label: context_json
          type: paragraph
          required: true
          default: ''
          max_length: 1000000
    - id: context
      type: custom
      position:
        x: 340
        y: 240
      sourcePosition: right
      targetPosition: left
      data:
        title: context
        desc: ''
        selected: false
        type: code
        code_language: python3
        code: "\"\"\"Literal non-trading number roles; offsets are Unicode code points.\n\nThis is lexical evidence, not permission\
          \ to publish a sourced price or amount.\nInvalid dates and trading units attached to a metadata-shaped token stay\
          \ visible\nto the economic validator. No rewriting of the original text occurs.\n\"\"\"\nfrom datetime import date\n\
          import re\n\n\ndef numeric_spelling(text):\n    \"\"\"Normalize one-code-point numeric glyphs without moving source\
          \ offsets.\"\"\"\n    return text.translate(str.maketrans('０１２３４５６７８９．＋－−％', '0123456789.+--%'))\n\n\ndef settlement_literal(token):\n\
          \    \"\"\"Read a selected date/settlement token, without inventing a calendar.\"\"\"\n    token = numeric_spelling(token).translate(str.maketrans('Ｔｔ','Tt'))\n\
          \    if re.fullmatch(r'T\\+[01]', token, re.I):\n        return token.upper()\n    for pattern in (r'(\\d{4})-(\\\
          d{1,2})-(\\d{1,2})', r'(\\d{4})/(\\d{1,2})/(\\d{1,2})',\n                    r'(\\d{4})年(\\d{1,2})月(\\d{1,2})日?'):\n\
          \        match = re.fullmatch(pattern, token)\n        if match:\n            return date(*(int(part) for part in\
          \ match.groups())).isoformat()\n    raise ValueError('Unsupported settlement literal')\n\n\ndef non_trading_spans(text):\n\
          \    result = []\n    dates = []\n    # Separate patterns keep mixed separators and partial invalid dates visible.\n\
          \    patterns = (r'(?<![\\d.])(\\d{4})-(\\d{1,2})-(\\d{1,2})(?!\\d|[.．]\\d)',\n                r'(?<![\\d.])(\\\
          d{4})/(\\d{1,2})/(\\d{1,2})(?!\\d|[.．]\\d)',\n                r'(?<![\\d.])(\\d{4})年(\\d{1,2})月(\\d{1,2})日?(?!日|\\\
          d|[.．]\\d)')\n    def trading_tail(end):\n        return bool(re.match(r'\\s*(?:万|亿|[wW](?![a-zA-Z])|[%％])', text[end:],\
          \ re.I))\n    for pattern in patterns:\n        for match in re.finditer(pattern, text):\n            dates.append((match.start(),\
          \ match.end()))\n            try:\n                date(*(int(v) for v in match.groups()))\n            except ValueError:\n\
          \                continue\n            if not trading_tail(match.end()):\n                result.append((match.start(),\
          \ match.end(), 'DATE'))\n    terms_text=numeric_spelling(text).translate(str.maketrans('Ｔｔ','Tt'))\n    for match\
          \ in re.finditer(r'(?<![a-zA-Z0-9_.])T\\+[01](?![a-zA-Z0-9_.])', terms_text, re.I):\n        if not trading_tail(match.end()):\n\
          \            result.append((match.start(), match.end(), 'SETTLEMENT'))\n    for match in re.finditer(r'(?<![\\d.])\\\
          d+(?:\\.\\d+)?\\s*(?:个?月|年|天|日|[dDyYmM](?![a-zA-Z]))', text):\n        if (not any(a < match.end() and match.start()\
          \ < b for a, b in dates)\n                and not trading_tail(match.end())):\n            result.append((match.start(),\
          \ match.end(), 'TENOR'))\n    for match in re.finditer(r'(?<![a-zA-Z0-9])(?:(?:A|P|F)[-－][123]|(?:Aaa|Aa|Baa|Ba|Caa|Ca|AAA|AA|A|BBB|BB|B|CCC|CC|C|D)[123+－-]?)(?![a-zA-Z0-9])',\
          \ text):\n        if not trading_tail(match.end()):\n            result.append((match.start(), match.end(), 'RATING'))\n\
          \    return sorted(result)\n\n\ndef mask_non_trading(text):\n    masked = list(text)\n    for start, end, _role\
          \ in non_trading_spans(text):\n        masked[start:end] = ' ' * (end - start)\n    return ''.join(masked)\n\ndef\
          \ valuation_offset_spans(text):\n    \"\"\"Literal BP operands, including an omitted BP unit after 中债/估值.\n    No\
          \ inferred price/side/intent: a valuation label plus an arithmetic operator\n    is required when the unit is absent.\
          \ Naked negative yields remain yields.\n    Spans address original Unicode code points, so the same lexer is embedded\n\
          \    in both Dify Code stages and used by server evidence validation.\n    \"\"\"\n    normalized = numeric_spelling(text).translate(str.maketrans('ＢＰｂｐ','BPbp'))\n\
          \    operator = r'(?:上浮|下浮|加|减|[+-])'\n    amount = r'\\d+(?:\\.\\d+)?'\n    unit = r'(?:[bB][pP](?![a-zA-Z])|基点)'\n\
          \    labelled = (r'(?:中债\\s*(?:估值)?|估值)\\s*(?:收益率\\s*)?'\n                + operator + r'\\s*' + amount + r'(?:\\\
          s*' + unit + r')?')\n    # Explicit %, money and quantity units are not an omitted BP unit. The\n    # digit/dot\
          \ guard also forbids regex backtracking to a shorter operand.\n    boundary = r'(?![\\d.a-zA-Z])(?!\\s*[%％万亿元份wW])'\n\
          \    labelled += boundary\n    explicit = r'(?<![a-zA-Z0-9_.])(?:' + operator + r'\\s*)?' + amount + r'\\s*' + unit\n\
          \    result = []\n    for match in re.finditer(labelled + '|' + explicit, normalized):\n        token = match[0]\n\
          \        digits = re.search(amount, token)[0]\n        negative = re.search(r'下浮|减|-', token) is not None\n    \
          \    result.append((match.start(), match.end(), ('-' if negative else '') + digits))\n    return result\n\n\"\"\"\
          High-recall literal spans and a bounded, local batch of field classifiers.\n\nNo candidate is a fact: bond, speaker,\
          \ side, negation and reference relationships\nstill require the joint semantic pass. Offsets always address the\
          \ original text.\n\"\"\"\nimport re\nimport unicodedata\n\n\ndef extract_spans(text, codes=()):\n    spans = []\n\
          \    def add(start, end, lexical):\n        spans.append({'start': start, 'end': end, 'token': text[start:end],\
          \ 'lexical': lexical})\n    for start, end, role in non_trading_spans(text):\n        add(start, end, role)\n  \
          \  for code in sorted(set(codes), key=lambda x: (-len(x), x)):\n        if code:\n            for match in re.finditer(re.escape(code),\
          \ text, re.I):\n                add(match.start(), match.end(), 'BOND_CODE')\n    for start, end, _value in valuation_offset_spans(text):\n\
          \        add(start, end, 'BP')\n    code_spans=[(s['start'],s['end']) for s in spans if s['lexical']=='BOND_CODE']\n\
          \    # A rating-shaped suffix overlapping a known code (SYN-A3.10) must not\n    # swallow the following price.\
          \ Keep both annotations, but protect the code.\n    protected = [(s['start'],s['end']) for s in spans if s['lexical']!='RATING'\n\
          \                 or not any(a<s['end'] and s['start']<b for a,b in code_spans)]\n    for match in re.finditer(r'(?<![\\\
          d.．])[-−－+＋]?\\d+(?:[.．]\\d+)?(?:\\s*(?:亿|万|[wW](?![a-zA-Z])|[%％]|元|份))?', text):\n        if not any(a < match.end()\
          \ and match.start() < b for a,b in protected):\n            add(match.start(), match.end(), 'NUMBER')\n    words\
          \ = {\n        'DIRECTION': r'\\b(?:bid|ofr|offer)\\b|收|出|买|卖',\n        'NEGATION': r'不是|不再|不|没|无',\n        'REFERENCE':\
          \ r'刚才|那只|那个|原价|之前|按你|上次|这只',\n        'CORRECTION': r'改|更正|写错|说错',\n        'WITHDRAWAL': r'撤回|撤掉|取消|不出了|不收了',\n\
          \        'QUESTION': r'吗|么|[?？]|多少|是否',\n        'CONDITION': r'如果|只要|条件|否则|的话',\n        'NEGOTIATION_SPACE': r'还能谈|还可以谈|不能再|最终|到头|还可|实价|意向',\n\
          \    }\n    for lexical, pattern in words.items():\n        for match in re.finditer(pattern, text, re.I):\n   \
          \         add(match.start(), match.end(), lexical)\n    unique = {(s['start'],s['end'],s['lexical']):s for s in\
          \ spans}\n    return sorted(unique.values(), key=lambda s:(s['start'],s['end'],s['lexical']))\n\n\ndef classify_spans(text,\
          \ spans):\n    \"\"\"Equivalent batch classification; no per-token threads or network calls.\"\"\"\n    result =\
          \ []\n    for span in spans:\n        start, end = span['start'], span['end']\n        if span['token'] != text[start:end]:\n\
          \            raise ValueError('Candidate no longer matches immutable source')\n        token = unicodedata.normalize('NFKC',\
          \ span['token']).replace('−','-')\n        lexical = span['lexical']; value = token\n        if lexical == 'NUMBER':\n\
          \            compact = re.sub(r'\\s+', '', token).removeprefix('+')\n            if compact.endswith(('亿','万','w','W')):\n\
          \                roles = ['QUANTITY']; value = compact\n            elif compact.endswith('%'):\n              \
          \  roles = ['YIELD']; value = compact[:-1]\n            elif compact.endswith(('元','份')):\n                roles\
          \ = ['NON_TRADE_AMOUNT']\n            else:\n                label = re.search(r'(净价|全价)\\s*[:：]?\\s*$', text[:start])\n\
          \                if label is None:\n                    label = re.match(r'\\s*(净价|全价)', text[end:])\n         \
          \       if label:\n                    roles = ['NET_PRICE' if label[1] == '净价' else 'DIRTY_PRICE']\n          \
          \      elif re.fullmatch(r'\\d{2}', compact):\n                    roles = ['YIELD_SUFFIX','QUANTITY']\n       \
          \         elif '.' in compact or compact.startswith('-'):\n                    roles = ['YIELD']\n             \
          \   elif int(compact) >= 100:\n                    roles = ['QUANTITY']\n                else:\n               \
          \     roles = ['YIELD','QUANTITY']\n                value = compact\n        elif lexical == 'BP':\n           \
          \ roles = ['CHINABOND_BP']\n            value = valuation_offset_spans(span['token'])[0][2]\n        elif lexical\
          \ == 'DIRECTION':\n            left, right = text[:start], text[end:]\n            compound = ((token == '出' and\
          \ (re.match(r'差|现|版|来|去|口|席|生', right) or re.search(r'指|支|提|突|进|付$', left[-1:])))\n                        or (token\
          \ == '收' and re.match(r'到|入|益|集|据|藏|获', right))\n                        or (token == '买' and re.match(r'方|家', right))\n\
          \                        or (token == '卖' and re.match(r'方|家', right)))\n            roles = ['NON_DIRECTION'] if\
          \ compound else ['SIDE_BID' if token.lower() in ('收','买','bid') else 'SIDE_OFR']\n        else:\n            roles\
          \ = [lexical]\n        result.append({**span, 'roles': roles, 'value': value})\n    return result\n\n\ndef collect_candidates(context):\n\
          \    \"\"\"Stable IDs within one immutable context, retaining message revision.\"\"\"\n    messages = {}\n    members\
          \ = context.get('members', [])\n    for member in members:\n        for row in member.get('context', []):\n    \
          \        messages[row['message_id']] = row\n    for row in context.get('context', []) + context.get('correction_context',\
          \ []) + context.get('messages', []):\n        messages[row['message_id']] = row\n    codes = [m.get('bond_code','')\
          \ for m in members] + [context.get('bond_code','')]\n    result = []\n    for message in messages.values():\n  \
          \      text = message['text']\n        for span in classify_spans(text, extract_spans(text, codes)):\n         \
          \   result.append({**span, 'id':'s'+str(len(result)), 'message_id':message['message_id'],\n                    \
          \       'revision':message.get('ingest_revision',0), 'direction':message.get('direction')})\n    return result\n\
          \n\ndef literal_member_hints(context, candidates):\n    \"\"\"Index an explicit same-clause bond label, never infer\
          \ a speaker or fact.\n\n    Unnamed references and multiple labels stay ambiguous. All candidates and\n    complete\
          \ source messages remain available to the joint semantic pass.\n    \"\"\"\n    members = context.get('members',\
          \ [])\n    messages = {row['message_id']: row for member in members for row in member.get('context', [])}\n    messages.update({row['message_id']:\
          \ row for row in context.get('messages', [])})\n    hints = {}\n    numeric = {'YIELD', 'YIELD_SUFFIX', 'CHINABOND_BP',\
          \ 'NET_PRICE', 'DIRTY_PRICE', 'QUANTITY'}\n    for candidate in candidates:\n        if not numeric.intersection(candidate['roles']):\n\
          \            continue\n        text = messages.get(candidate['message_id'], {}).get('text', '')\n        prefix\
          \ = re.split(r'[,，;；。！？!?\\n]', text[:candidate['start']])[-1]\n        clause_start = candidate['start'] - len(prefix)\n\
          \        suffix = re.split(r'[,，;；。！？!?\\n]', text[candidate['start']:], maxsplit=1)[0]\n        if re.search(r'另一|那只|这只|前者|后者|两只|两券|都|同价|分别|各自|按|照',\
          \ prefix + suffix):\n            continue\n        named = set()\n        for member in members:\n            code\
          \ = member.get('bond_code')\n            if code and any(clause_start <= match.start() and match.end() <= candidate['start']\n\
          \                            for match in re.finditer(r'(?<![a-zA-Z0-9_.-])'+re.escape(code)+\n                \
          \                                     r'(?![a-zA-Z0-9_.-])', text, re.I)):\n                named.add(member['member_id'])\n\
          \        # Duplicate/overlapping known codes must not select one arbitrary owner.\n        if len(named) == 1:\n\
          \            hints[candidate['id']] = sorted(named)\n    return hints\n\n\ndef direct_price_question(text, bond_codes=()):\n\
          \    \"\"\"Recognize a complete modal-before-price question, not any question mark.\"\"\"\n    text=numeric_spelling(text)\n\
          \    for code in sorted(bond_codes,key=len,reverse=True):\n        text=re.sub(r'^\\s*'+re.escape(numeric_spelling(code))+r'(?![a-zA-Z0-9])\\\
          s*','',text,count=1,flags=re.I)\n    number=r'[+-]?\\d+(?:\\.\\d+)?'\n    return bool(re.fullmatch(r'\\s*(?:能否|可否|是否能|能不能|可以|能)\\\
          s*'+number+\n        r'\\s*%?\\s*(?:收|出|买|卖)\\s*'+number+r'\\s*(?:万|亿|[wW])?\\s*(?:吗|么)?[?？]\\s*',text))\n\n\ndef\
          \ no_change_acknowledgement(context):\n    \"\"\"Select a shorter prompt only for closed, single-member wait replies.\n\
          \n    This changes no observations or evidence. The model and normal contract\n    still handle the full input,\
          \ including any known outgoing question.\n    \"\"\"\n    members = context.get('members', [])\n    if (len(members)\
          \ != 1 or 'validation_feedback' in context\n            or any(context.get(key) for key in ('tool_results', 'history_results',\
          \ 'correction_context', 'corrections'))):\n        return False\n    member = members[0]\n    code, mid = member.get('bond_code'),\
          \ member.get('member_id')\n    if not isinstance(code, str) or not code or not mid:\n        return False\n    pattern\
          \ = (r'\\s*(?:'+re.escape(code)+r'(?![a-zA-Z0-9_.-])\\s*[:：,，]?\\s*)?'\n               r'(?:稍等|等一下)\\s*[。.!！]?\\\
          s*')\n    outbound = context.get('known_outbound_scopes', {})\n    inbound = False\n    for message in context.get('messages',\
          \ []):\n        if message.get('historical') or message.get('kind', 'message') != 'message':\n            return\
          \ False\n        if message.get('direction') == 'out':\n            if not isinstance(outbound, dict) or outbound.get(message.get('message_id'))\
          \ != [mid]:\n                return False\n        elif message.get('direction') == 'in':\n            text = message.get('text')\n\
          \            if not isinstance(text, str) or not re.fullmatch(pattern, text, re.I):\n                return False\n\
          \            inbound = True\n        else:\n            return False\n    return inbound\n\n\ndef direct_priced_calculation(context):\n\
          \    \"\"\"A narrow prompt route, never a fact or permission to discard output.\n\n    One complete current quote\
          \ precedes a separate, explicitly hypothetical\n    yield comparison with two supplied operands. Anything else uses\
          \ the full\n    joint/reference prompt, including a second side with an unstated price.\n    \"\"\"\n    members=context.get('members',[]);messages=context.get('messages',[])\n\
          \    if len(members)!=1 or len(messages)!=1:return False\n    message=messages[0];code=members[0].get('bond_code')\n\
          \    if not code or message.get('direction')!='in' or message.get('historical'):return False\n    text=numeric_spelling(message.get('text',''))\n\
          \    marker=re.search(r'(?<=[。；;，,])\\s*(?:另外|顺便|另请)[^。；;：:\\d]{0,28}(?:核算|计算|比较|算一下)\\s*[:：]?',text)\n    if not\
          \ marker:return False\n    quoted=text[:marker.start()].rstrip('。；;，, \\t\\n')\n    price=r'(?:[+-]?\\d+\\.\\d+%?|[+-]?\\\
          d+%)'\n    size=r'\\d+(?:\\.\\d+)?\\s*(?:万|亿|[wW])?'\n    if not re.fullmatch(r'\\s*'+re.escape(numeric_spelling(code))+r'\\\
          s*'+price+\n                        r'\\s*(?:出|收|买|卖|ofr|bid)\\s*'+size+r'\\s*',quoted,re.I):return False\n    calculation=text[marker.end():]\n\
          \    if not (re.search(r'假设',calculation) and re.search(r'收益率',calculation)\n            and re.search(r'(?:差|差值|价差|利差).{0,12}(?:BP|基点)',calculation,re.I)):return\
          \ False\n    if re.search(r'按|照|原价|那个价|不变|改|撤|如果|假如|条件|别家|客户|\\b(?:bid|ofr|offer)\\b',calculation,re.I):return False\n\
          \    candidates=classify_spans(calculation,extract_spans(calculation))\n    numeric=[span for span in candidates\
          \ if span['lexical'] in ('NUMBER','BP','DATE','SETTLEMENT','TENOR')]\n    if len(numeric)!=2 or any(span['roles']!=['YIELD']\
          \ for span in numeric):return False\n    first,second=numeric\n    # Two numbers alone do not establish whose comparison\
          \ this is. Unknown\n    # bond names/identifiers or extra instructions fall back to the full pass.\n    return bool(re.fullmatch(r'假设(?:同一|相同)(?:到期|行权)?收益率口径\\\
          s*[，,:：]?\\s*',calculation[:first['start']])\n        and re.fullmatch(r'\\s*(?:和|与|跟)\\s*(?:(?:你|您|贵方|我方)(?:之前|刚才|上次|已报)?\\\
          s*)?',calculation[first['end']:second['start']])\n        and re.fullmatch(r'\\s*(?:收|出|买|卖)?\\s*的?\\s*(?:相差|差值|价差|利差|差)(?:是)?多少\\\
          s*(?:BP|基点)[？?]?'\n                         r'(?:[。.]?\\s*(?:答复|回复)不重复(?:这两个|两个)?(?:原始)?收益率[，,]\\s*不作成交[。.]?)?\\\
          s*',\n                         calculation[second['end']:],re.I))\n\n\ndef window_reference_gaps(context, scopes=None):\n\
          \    \"\"\"Locate explicitly named price references in the supplied window only.\"\"\"\n    members={m['member_id']:m\
          \ for m in context.get('members',[])}\n    current=context.get('messages',[])\n    gaps={}\n    for message in current:\n\
          \        if message.get('direction')!='in':continue\n        text=message['text'];refs=set()\n        for match\
          \ in re.finditer(r'(?:消息\\s*|\\bmessage\\s+)([a-zA-Z0-9_-]{6,160})',text,re.I):\n            near=text[max(0,match.start()-6):match.start()]+text[match.end():match.end()+24]\n\
          \            if re.search(r'按|照|价|报盘',near):refs.add(match[1])\n        if not refs:continue\n        mids=(scopes.get(message['message_id'],[])\
          \ if scopes is not None else\n              [mid for mid,m in members.items() if m.get('bond_code') and m['bond_code'].casefold()\
          \ in text.casefold()])\n        for mid in mids:\n            if mid not in members:continue\n            loaded={m['message_id']\
          \ for m in members[mid].get('context',[])+current}\n            missing=refs-loaded\n            if missing:\n \
          \               gap=gaps.setdefault(mid,{'source_ids':[],'missing_ids':[]})\n                gap['source_ids']=sorted(set(gap['source_ids'])|{message['message_id']})\n\
          \                gap['missing_ids']=sorted(set(gap['missing_ids'])|missing)\n    return gaps\n\n\"\"\"Source-bound\
          \ public fragments and the complete authorized quote grid.\n\nRendering does not choose an action or authorize sending.\
          \ The application\nrebuilds the result with its own context, then applies its normal state gates.\n\"\"\"\nfrom\
          \ decimal import Decimal, InvalidOperation, ROUND_CEILING, ROUND_FLOOR\nimport hashlib\nimport json\nimport re\n\
          \n\ndef _decimal(value):\n    if not isinstance(value, str):raise ValueError('Price must be a decimal string')\n\
          \    if not re.fullmatch(r'-?\\d{1,12}(?:\\.\\d{1,8})?',value.strip()):raise ValueError('Invalid decimal spelling')\n\
          \    try: result=Decimal(value)\n    except InvalidOperation as exc:raise ValueError('Invalid decimal') from exc\n\
          \    if not result.is_finite():raise ValueError('Nonfinite decimal')\n    return result\n\n\ndef _fact(value):\n\
          \    if isinstance(value,dict) and 'value' in value:\n        return value['value']\n    return value\n\n\ndef quote_grid(context):\n\
          \    \"\"\"Represent every authorized 0.01 tick with a constant-size index range.\"\"\"\n    domain=context.get('quote_constraints')\
          \ or {}\n    status=domain.get('status','UNAVAILABLE')\n    grid={'status':status,'first_yield_pct':None,'last_yield_pct':None,'tick_size':'0.01',\n\
          \          'index_min':None,'index_max':None,'count':0}\n    if status!='AVAILABLE':return grid\n    # An older/incomplete\
          \ projection can still carry cash facts for a question.\n    # It supplies no price authorization: never invent\
          \ a missing tick size.\n    if 'tick_size' not in domain:return {**grid,'status':'UNAVAILABLE'}\n    tick=_decimal(domain.get('tick_size'))\n\
          \    if tick!=Decimal('0.01'):raise ValueError('Unsupported authorized quote tick')\n    lower=_decimal(domain.get('min_yield_pct'));upper=_decimal(domain.get('max_yield_pct'))\n\
