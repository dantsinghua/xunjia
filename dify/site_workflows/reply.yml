          \            except ValueError:\n                continue\n            if\
          \ not trading_tail(match.end()):\n                result.append((match.start(),\
          \ match.end(), 'DATE'))\n    terms_text=numeric_spelling(text).translate(str.maketrans('Ｔｔ','Tt'))\n\
          \    for match in re.finditer(r'(?<![a-zA-Z0-9_.])T\\+[01](?![a-zA-Z0-9_.])',\
