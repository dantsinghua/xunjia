          \ [])\n    messages = {row['message_id']: row for member in members for\
          \ row in member.get('context', [])}\n    messages.update({row['message_id']:\
          \ row for row in context.get('messages', [])})\n    hints = {}\n    numeric\
          \ = {'YIELD', 'YIELD_SUFFIX', 'CHINABOND_BP', 'NET_PRICE', 'DIRTY_PRICE',\
          \ 'QUANTITY'}\n    for candidate in candidates:\n        if not numeric.intersection(candidate['roles']):\n\
