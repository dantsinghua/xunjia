              - arguments_json
      responses:
        '200':
          description: 只读ToolResult；status不是ok时不得编造结果
          content:
            application/json:
              schema:
                type: object
                required:
                - schema_version
                - status
                - data
                - usage
                properties:
                  schema_version:
                    type: string
                    enum:
                    - '1'
                  status:
                    type: string
                    enum:
                    - ok
                    - partial
                    - ambiguous
                    - not_found
                    - unsupported
                    - invalid_input
                    - unavailable
                  data:
                    type: object
                    nullable: true
                  usage:
                    type: string
                    enum:
                    - analysis_only
