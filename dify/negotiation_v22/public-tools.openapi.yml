      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                arguments_json:
                  type: string
                  minLength: 2
                  maxLength: 65536
                  description: 按全量字典查券或稳定ID取资料；歧义不选top1，缺数据不补模拟值。 arguments_json必须是下列JSON
